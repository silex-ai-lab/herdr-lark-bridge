[project]
name = "herdr-lark-bridge"
version = "0.1.0"
description = "Bridge Herdr agent attention events to Lark and Lark replies back into panes"
requires-python = ">=3.12"
dependencies = ["lark-oapi"]

[project.scripts]
herdr-lark = "herdr_lark.cli:main"

[dependency-groups]
dev = ["pytest", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
